    <div id="app">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-box">
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <path d="M256 60L452 256L256 452L60 256Z" fill="#11141c" stroke="#c9a45c" stroke-width="14" />
            <path d="M256 98L414 256L256 414L98 256Z" fill="none" stroke="#e8d29a" stroke-width="4" />
            <g class="lens">
              <circle cx="240" cy="236" r="66" fill="none" stroke="#e8d29a" stroke-width="20" />
              <circle cx="240" cy="236" r="44" fill="#c9a45c" fill-opacity="0.18" />

            </g>
          </svg>
          <div class="boot-name">Detective Achille</div>
          <div class="boot-bar"></div>
          <div class="boot-label" id="boot-label">Loading…</div>
        </div>
      </div>
      <script>
        // The loading line in the player's language (as the game picks it: saved choice, then browser).
        (function () {
          var words = { en: 'Loading…', tr: 'Yükleniyor…', fr: 'Chargement…', es: 'Cargando…' };
          var pick = null;
          try {
            var saved = JSON.parse(localStorage.getItem('cingoz:v1:pref:lang') || 'null');
            if (words[saved]) pick = saved;
          } catch (e) {}
          var langs = navigator.languages || [navigator.language];
          for (var i = 0; !pick && i < langs.length; i++) {
            var base = String(langs[i] || '').slice(0, 2).toLowerCase();
            if (words[base]) pick = base;
          }
          document.getElementById('boot-label').textContent = words[pick || 'en'];
        })();
      </script>
    </div>
    <noscript>Detective Achille needs JavaScript to run.</noscript>
